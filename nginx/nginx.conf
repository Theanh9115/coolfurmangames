server {
    listen 80;
    server_name localhost;

    root /var/www/html;

    # Static assets: served directly by nginx, no Flask involved.
    # Cache headers are disabled here for development - if you deploy
    # this for real later, you'll likely want `expires max;` instead,
    # which tells browsers to cache these files aggressively.
    location /static/ {
        root /var/www/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    # Plain HTML/XML/TXT files: also served directly by nginx.
    location ~ \.(html|xml|txt)$ {
        root /var/www/html;
    }

    # Everything else gets passed to Flask (gunicorn), for anything
    # dynamic - form handling, database-backed pages, API routes, etc.
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
