      <h1>Tic Tac Toe</h1>
      <div class="tic-tac-toe-info">

          <div>
            <h2>Turn:</h2>
            <span class="turn"></span>
          </div>

      </div>

        <div class="tic-tac-toe-gameboard">
          <div
            class="tic-tac-toe-child"
            id="r1c1"
            onclick="
              placeMove(event);
              // AI rendering: let the browser paint the updated DOM first,
              // then evaluate the board for a win/draw.
              requestAnimationFrame(() => {
                requestAnimationFrame(checkGameEnd);
              });
