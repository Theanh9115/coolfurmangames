<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./static/css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <title>Game 2</title>
  </head>

  <body>
    <header>
      <nav class="nav-bar">
        <div class="nav-home">
          <a href="./main.html">
            <img id="home-img" src="./static/img/FG-Logo(alt).png" alt=""
          /></a>
          <h1 id="nav-title">Cool Furman Games!</h1>
        </div>
        <div class="nav-pages">
          <div class="nav-page">
            <a class="nav-link" href="./about.html">About Us</a>
          </div>
          <div class="nav-page">
            <a class="nav-link" href="./leaderboards.html">Leaderboard</a>
          </div>
          <div class="nav-page">
            <a class="nav-link" href="./localscore.html">Local Scores</a>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <h1>Game 2</h1>
      <div>
        Turn:
        <span class="player"></span>
        <button type="submit" class="reset-btn">New Game</button>
      </div>
      <div class="tic-tac-toe">
        <div
          class="tic-tac-toe-child"
          id="r1c1"
          onclick="placeMove(event)"
        ></div>
        <div
          class="tic-tac-toe-child"
          id="r1c2"
          onclick="placeMove(event)"
        ></div>
        <div
          class="tic-tac-toe-child"
          id="r1c3"
          onclick="placeMove(event)"
        ></div>
        <div
          class="tic-tac-toe-child"
          id="r2c1"
          onclick="placeMove(event)"
        ></div>
        <div
          class="tic-tac-toe-child"
          id="r2c2"
          onclick="placeMove(event)"
        ></div>
        <div
          class="tic-tac-toe-child"
          id="r2c3"
          onclick="placeMove(event)"
        ></div>
        <div
          class="tic-tac-toe-child"
          id="r3c1"
          onclick="placeMove(event)"
        ></div>
        <div
          class="tic-tac-toe-child"
          id="r3c2"
          onclick="placeMove(event)"
        ></div>
        <div
          class="tic-tac-toe-child"
          id="r3c3"
          onclick="placeMove(event)"
        ></div>
      </div>
    </main>
    <script src="./static/js/game2.js"></script>
  </body>
</html>
